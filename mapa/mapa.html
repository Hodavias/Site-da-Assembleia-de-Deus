<!DOCTYPE html>
<html lang="pt-br">

<head>

                </form>
            </search>

        </div>

        <div class="botão-mapa">
            <button id="proximo"> Mais Proximo</button>
        </div>

        <div class="titulo-regiao">

            <button class="regiao-ativo">Ver mais regiões <svg xmlns="http://www.w3.org/2000/svg" height="15px"

                    <path d="M440-800v487L216-537l-56 57 320 320 320-320-56-57-224 224v-487h-80Z" />

        </div>

        <div class="container-regiao">

                    <h3>Marituba I</h3>
                </div>

                <div class="box-região">
                    <h3>Marituba II</h3>
                </div>

                <div class="box-região">
                    <h3>Marituba III</h3>
                </div>

                <div class="box-região">
                    <h3>Marituba IV</h3>
                </div>

                <div class="box-região">
                    <h3>Marituba V</h3>
                </div>

                <div class="box-região">
                    <h3>Marituba VI</h3>
                </div>

            </div>
            <br>
            <br>
            <div class="regiao">

                <div class="box-região">
                    <h3>Ananindeua I</h3>
                </div>

                <div class="box-região">
                    <h3>Ananindeua II</h3>
                </div>

                <div class="box-região">
                    <h3>Ananindeua III</h3>
                </div>

            </div>

            <br>

            <div class="regiao">

                <div class="box-região">
                    <h3>Região interior</h3>
                </div>


            </div>



        </div>

    </header>

    <!--Parte do mapa da aba -->

        <div class="box-mapa">
<iframe src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d22639.94485802893!2d-48.33079995615574!3d-1.3692635067589383!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1778179766781!5m2!1spt-BR!2sbr" width="1000" height="550" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
